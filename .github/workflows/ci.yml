name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Frontend typecheck
        run: npm run tsc

      - name: Frontend unit tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Backend unit tests
        env:
          # Placeholders locais ao job — nunca secrets reais. env.js exige estas
          # chaves ao importar módulos; os unit tests mockam I/O e não falam com
          # Supabase/Stripe de verdade.
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci-test-jwt-access-secret-not-for-prod
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-not-for-prod
          SUPABASE_URL: https://example.invalid
          SUPABASE_SERVICE_ROLE_KEY: ci-test-service-role-not-for-prod
          # 32 bytes em base64 (só para testes de crypto; não é chave de produção)
          DATA_ENCRYPTION_KEY: gnlpC9dSI3yqfif5l7xZA74j1bLlyAqfCR+cTNyJIZs=
          STRIPE_SECRET_KEY: sk_test_ci_placeholder_not_for_prod
          STRIPE_CONNECT_ENABLED: "true"
          PRODUCT_MODE: contabil
        run: npm run test:backend

      - name: Backend static security audit
        run: npm run test:security-static -w backend

      - name: Tenant isolation test (staging)
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          # JWT só para assinar tokens de teste no script; não precisa coincidir com prod.
          JWT_ACCESS_SECRET: ci-test-jwt-access-secret-not-for-prod
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-not-for-prod
          PRODUCT_MODE: contabil
          TENANT_ISOLATION_FAIL_ON_WARNINGS: "false"
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::STAGING_SUPABASE_URL / STAGING_SUPABASE_SERVICE_ROLE_KEY em falta."
            echo "Cria o projeto Supabase de staging e cadastra os secrets no repositório."
            echo "Nunca apontes isto para o Supabase de produção: este teste escreve dados reais."
            echo "Ver docs/06-SEGURANCA/SECURITY-GATES.md"
            exit 1
          fi
          npm run test:tenant-isolation -w backend

      - name: File size limits
        run: npm run check:file-sizes

      - name: Secret scan
        run: npm run security:secrets
